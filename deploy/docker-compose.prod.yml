# QuestLog production (and staging) stack. See docs/DEPLOYMENT.md.
#
# Runs prebuilt images from GitHub Container Registry; nothing is built on the server. The deploy workflow copies this
# directory to the server and runs scripts/deploy.sh, which writes the image tag to .image.env and starts the stack:
#
#   docker compose -f docker-compose.prod.yml --env-file .env --env-file .image.env up -d
#
# .env (created by hand from .env.production.example, never committed) holds every secret and setting.
# Only Caddy publishes ports (80/443); the database, Redis, Django, workers and Next.js are reachable only inside the
# Compose network. Flower is opt-in (--profile tools) and bound to the server's loopback interface for SSH tunnels.

name: questlog

x-backend: &backend
  image: ${BACKEND_IMAGE:?set BACKEND_IMAGE in .env}:${IMAGE_TAG:?set by scripts/deploy.sh}
  env_file: .env
  restart: always
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging: *logging

  db:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging

  backend:
    <<: *backend
    # The image's default command: gunicorn with config/gunicorn.conf.py. Its entrypoint applies migrations first.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      RUN_MIGRATIONS: "false"
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  celery-beat:
    <<: *backend
    # Exactly one beat may run, or scheduled tasks are queued twice.
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      RUN_MIGRATIONS: "false"
    healthcheck:
      disable: true
    depends_on:
      celery-worker:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE in .env}:${IMAGE_TAG:?set by scripts/deploy.sh}
    restart: always
    # Only the variables the frontend reads at runtime, so Django's secrets never reach this container.
    environment:
      FEATURE_ANALYTICS: ${FRONTEND_FEATURE_ANALYTICS:-false}
      FEATURE_MFA_SETUP: ${FRONTEND_FEATURE_MFA_SETUP:-true}
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

  # Celery monitoring UI. Start with: docker compose ... --profile tools up -d flower
  # Then from your machine: ssh -L 5555:localhost:5555 <user>@<server> and open http://localhost:5555
  flower:
    <<: *backend
    profiles: ["tools"]
    command: ["celery", "-A", "config", "flower", "--port=5555"]
    environment:
      RUN_MIGRATIONS: "false"
    ports:
      - "127.0.0.1:5555:5555"
    healthcheck:
      disable: true
    depends_on:
      celery-worker:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
