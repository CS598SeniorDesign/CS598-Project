# Prometheus configuration for the optional `monitoring` compose profile.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: questlog-backend
    metrics_path: /metrics/
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["backend:8000"]
