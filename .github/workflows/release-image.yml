name: Release images

# When a version tag is pushed (e.g. v1.0.0-RELEASE), build the backend and frontend images for both x86 and ARM, push
# them to GitHub Container Registry tagged with the version, and publish a GitHub Release with the files needed to run
# them. This is QuestLog's runnable containerized artifact: see "Running a release" in docs/DEPLOYMENT.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  images:
    name: Build and push release images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.names.outputs.backend_image }}
      frontend_image: ${{ steps.names.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v7

      - name: Image names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "backend_image=ghcr.io/$owner/questlog-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/$owner/questlog-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.names.outputs.backend_image }}:${{ github.ref_name }}
            ${{ steps.names.outputs.backend_image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          push: true
          cache-from: type=gha,scope=backend-release
          cache-to: type=gha,scope=backend-release,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: runner
          platforms: linux/amd64,linux/arm64
          build-args: |
            INTERNAL_API_URL=http://backend:8000
          tags: |
            ${{ steps.names.outputs.frontend_image }}:${{ github.ref_name }}
            ${{ steps.names.outputs.frontend_image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          push: true
          cache-from: type=gha,scope=frontend-release
          cache-to: type=gha,scope=frontend-release,mode=max

  github-release:
    name: Publish GitHub Release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the release with the deployment files attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BACKEND_IMAGE: ${{ needs.images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend_image }}
        run: |
          tar -czf "questlog-${TAG}-deploy.tar.gz" -C deploy docker-compose.prod.yml Caddyfile .env.production.example scripts
          cat > notes.md <<EOF
          Container images (linux/amd64 and linux/arm64):

          - \`${BACKEND_IMAGE}:${TAG}\`
          - \`${FRONTEND_IMAGE}:${TAG}\`

          To run this release, unpack \`questlog-${TAG}-deploy.tar.gz\`, copy \`.env.production.example\` to \`.env\` and
          fill it in, then run \`sh scripts/deploy.sh ${TAG}\`. Set \`APP_DOMAIN=localhost\` to try it on one machine
          (Caddy then uses a locally trusted certificate). See docs/DEPLOYMENT.md for details.
          EOF
          gh release create "$TAG" "questlog-${TAG}-deploy.tar.gz" --title "QuestLog $TAG" --notes-file notes.md --verify-tag
