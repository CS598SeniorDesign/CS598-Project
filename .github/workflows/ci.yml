name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt ruff

      - name: Run Ruff lint
        run: |
          set -o pipefail
          ruff check . 2>&1 | tee ruff-output.txt

      - name: Upload backend lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-log
          path: backend/ruff-output.txt
          if-no-files-found: warn

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run ESLint
        run: |
          set -o pipefail
          npm run lint --prefix frontend 2>&1 | tee frontend-lint-output.txt

      - name: Upload frontend lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lint-log
          path: frontend-lint-output.txt
          if-no-files-found: warn

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan for secrets
        run: |
          set -o pipefail
          trufflehog filesystem . --no-update --fail 2>&1 | tee trufflehog-output.txt

      - name: Upload secret scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-log
          path: trufflehog-output.txt
          if-no-files-found: warn

  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SECRET_KEY: test-secret-key
      JWT_SECRET_KEY: test-jwt-secret
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run Django tests
        run: |
          set -o pipefail
          python manage.py test --verbosity 2 2>&1 | tee backend-test-output.txt

      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend/backend-test-output.txt
          if-no-files-found: warn

  ci-summary:
    name: CI summary
    needs:
      - backend-lint
      - frontend-lint
      - secret-scan
      - backend-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write CI summary
        run: |
          echo "## CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend lint: ${{ needs.backend-lint.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend lint: ${{ needs.frontend-lint.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Secret scan: ${{ needs.secret-scan.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend tests: ${{ needs.backend-tests.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To link this run to a GitHub issue, include 'Fixes #<issue-number>' in the PR title or description." >> "$GITHUB_STEP_SUMMARY"
