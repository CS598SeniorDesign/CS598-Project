name: CI

on:
  pull_request:
    branches:
      - main
      - testing
      - qa
      - production
  push:
    branches:
      - main
      - testing
      - qa
      - production
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'release/**'
      - 'refactor/**'
      - 'docs/**'
      - 'chore/**'

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: test-secret-key
      JWT_SECRET_KEY: test-jwt-secret
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_NAME: test_db
      DATABASE_USERNAME: test_user
      DATABASE_PASSWORD: test_password
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      REDIS_CACHE_URL: redis://localhost:6379/0
      REDIS_SESSION_URL: redis://localhost:6379/1
      REDIS_CELERY_URL: redis://localhost:6379/2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Run Ruff lint
        run: |
          set -o pipefail
          uv run ruff check . --exclude 'migrations' 2>&1 | tee ruff-output.txt

      - name: Check Ruff formatting
        run: uv run ruff format --check . --exclude 'migrations'

      - name: Run mypy type check
        run: uv run mypy
        continue-on-error: true # switch to false when backend is fully typed

      - name: Check for unreachable / non-reversible migrations
        run: uv run python manage.py lintmigrations

      - name: Run migrations
        run: uv run python manage.py migrate --noinput

      - name: Upload backend lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-log
          path: backend/ruff-output.txt
          if-no-files-found: warn

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run ESLint
        run: |
          set -o pipefail
          npm run lint --prefix frontend 2>&1 | tee frontend-lint-output.txt

      - name: Run TypeScript type check
        run: npm run typecheck --prefix frontend

      - name: Check frontend formatting
        run: npm run format:check --prefix frontend

      - name: Upload frontend lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lint-log
          path: frontend-lint-output.txt
          if-no-files-found: warn

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan for secrets
        run: |
          set -o pipefail
          trufflehog filesystem . --no-update --fail --exclude-paths=trufflehog-exclude.txt 2>&1 | tee trufflehog-output.txt

      - name: Upload secret scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-log
          path: trufflehog-output.txt
          if-no-files-found: warn

  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: test-secret-key
      JWT_SECRET_KEY: test-jwt-secret
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_NAME: test_db
      DATABASE_USERNAME: test_user
      DATABASE_PASSWORD: test_password
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      REDIS_CACHE_URL: redis://localhost:6379/0
      REDIS_SESSION_URL: redis://localhost:6379/1
      REDIS_CELERY_URL: redis://localhost:6379/2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Run Django tests
        run: |
          set -o pipefail
          uv run pytest --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60 -v 2>&1 | tee backend-test-output.txt

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend/backend-test-output.txt
          if-no-files-found: warn

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: |
          set -o pipefail
          npm run test:coverage --prefix frontend 2>&1 | tee frontend-test-output.txt

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn

      - name: Upload frontend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-log
          path: frontend-test-output.txt
          if-no-files-found: warn

  docker-compose-smoke-test:
    name: Docker Compose — Single-Command Startup Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cp .env.example .env
          echo "DJANGO_SECRET_KEY=ci-smoke-test-secret" >> .env
          cp frontend/.env.example frontend/.env

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Dump backend logs for diagnosis
        if: always()
        run: |
          echo "--- questlog-django logs ---"
          docker compose logs backend
          echo "--- questlog-django inspect ---"
          docker inspect questlog-django --format='{{json .State}}' | head -c 2000
          echo ""
          echo "--- health check log ---"
          docker inspect questlog-django --format='{{json .State.Health}}'

      - name: Fail if stack didn't start
        run: |
          docker compose ps
          docker compose ps | grep -q "questlog-django.*Up" || exit 1

      - name: Wait for backend liveness
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health/; then
              echo "Backend live"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend never became live"
          docker compose logs
          exit 1

      - name: Confirm backend readiness (DB + Redis reachable)
        run: |
          response=$(curl -sf http://localhost:8000/ready/) || {
            echo "Readiness check failed to respond"
            docker compose logs
            exit 1
          }
          echo "$response"
          echo "$response" | jq -e '.status == "ok"' > /dev/null || {
            echo "Backend reported unhealthy dependencies"
            exit 1
          }

      - name: Confirm migrations applied cleanly in container
        run: |
          docker compose exec -T backend python manage.py showmigrations --plan
          docker compose exec -T backend python manage.py migrate --check

      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend-standalone-build:
    name: Frontend Standalone Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create CI env file
        run: cp frontend/.env.example frontend/.env

      - name: Build production image (runner stage)
        run: |
          docker build \
            --target runner \
            -t questlog-frontend:ci \
            ./frontend

      - name: Run container
        run: |
          docker run -d \
            --name frontend-smoke \
            -p 3000:3000 \
            questlog-frontend:ci

      - name: Wait for container to be healthy
        run: |
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' nextjs 2>/dev/null || echo '"not-found"')
            echo "STATUS: $STATUS"
            if [[ $STATUS == '"ok"' ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not respond in time"
          echo "--- Verbose host curl attempt ---"
          curl -v --max-time 5 http://127.0.0.1:3000/api/health || true
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker logs frontend-smoke

      - name: Clean up
        if: always()
        run: |
          docker stop frontend-smoke || true
          docker rm frontend-smoke || true

  dependency-review:
    name: Dependency vulnerability review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  qa-validation:
    name: QA validation
    if: github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev --locked

      - name: Run Django system check
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: qa-secret-key
          JWT_SECRET_KEY: qa-jwt-secret
          DEBUG: 'False'
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          CSRF_TRUSTED_ORIGINS: http://localhost:3000
          BACKEND_URL: http://localhost:8000
          FRONTEND_URL: http://localhost:3000
          DATABASE_ENGINE: django.db.backends.postgresql
          DATABASE_NAME: qa_check_db
          DATABASE_USERNAME: qa_check_user
          DATABASE_PASSWORD: qa-check-password
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
        run: uv run python manage.py check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend for QA smoke test
        run: npm run build --prefix frontend

  production-gate:
    name: Production gate
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
      - qa-validation

    steps:
      - name: Production approval gate
        run: |
          echo "Production branch reached. This is the final deployment gate."

  ci-summary:
    name: CI summary
    needs:
      - backend-lint
      - frontend-lint
      - secret-scan
      - backend-tests
      - frontend-tests
      - qa-validation
      - production-gate
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write CI summary
        run: |
          echo "## CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend lint: ${{ needs.backend-lint.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend lint: ${{ needs.frontend-lint.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Secret scan: ${{ needs.secret-scan.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend tests: ${{ needs.backend-tests.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend tests: ${{ needs.frontend-tests.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- QA validation: ${{ needs.qa-validation.result || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production gate: ${{ needs.production-gate.result || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To link this run to a GitHub issue, include 'Fixes #<issue-number>' in the PR title or description." >> "$GITHUB_STEP_SUMMARY"
