version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      prefix: chore
      include: scope
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: chore
      include: scope
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    # These major upgrades broke CI when merged automatically, so they stay on their current major until someone
    # migrates them on purpose. Minor and patch updates still arrive as usual.
    ignore:
      # TypeScript 7 (the native compiler) is not supported yet by typescript-eslint or by ts-node, which Jest uses to
      # load jest.config.ts.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # ESLint 10 removed context.getFilename(), which the eslint-plugin-react bundled with eslint-config-next still
      # calls, so ESLint crashes before linting anything.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Tailwind 4 moved its PostCSS plugin to @tailwindcss/postcss and replaced the @tailwind directives, so it needs
      # a migration (npx @tailwindcss/upgrade) rather than a version bump.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, tooling]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: monthly
    labels: [dependencies, docker]
    commit-message:
      prefix: chore
      include: scope
