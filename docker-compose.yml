services:
  db:
    image: pgvector/pgvector:pg17
    container_name: questlog-db
    env_file:
      - ${DOCKER_ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - questlog-net
  redis:
    image: redis:latest
    container_name: questlog-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - ${DOCKER_ENV_FILE:-.env}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - questlog-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: questlog-django
    ports:
      - "8000:8000"
    env_file:
      - ${DOCKER_ENV_FILE:-.env}
    environment:
      DEBUG: ${DOCKER_DEBUG:-False}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      # Install dependencies added since the backend_venv volume was created (see entrypoint.sh).
      SYNC_DEPENDENCIES: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - questlog-net
    volumes:
      - ./backend:/app

  # Celery services share the backend image and code. They start once the backend is healthy, so migrations have run.
  # Celery does not reload on code changes: `docker compose restart celery-worker celery-beat` after editing tasks.
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: questlog-celery-worker
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - ${DOCKER_ENV_FILE:-.env}
    environment:
      RUN_MIGRATIONS: "false"
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - questlog-net
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: questlog-celery-beat
    # The schedule state file lives outside the bind-mounted source tree. Run exactly one beat, or tasks are queued twice.
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    env_file:
      - ${DOCKER_ENV_FILE:-.env}
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      celery-worker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - questlog-net
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

  # Task monitoring UI at http://localhost:5555. Set FLOWER_BASIC_AUTH=user:password in .env to require a login.
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: questlog-flower
    command: ["celery", "-A", "config", "flower", "--port=5555"]
    env_file:
      - ${DOCKER_ENV_FILE:-.env}
    environment:
      RUN_MIGRATIONS: "false"
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      celery-worker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - questlog-net
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: questlog-nextjs
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - questlog-net
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  # Optional metrics scraper: docker compose --profile monitoring up. Needs METRICS_TOKEN in .env.
  prometheus:
    image: prom/prometheus:latest
    container_name: questlog-prometheus
    profiles: ["monitoring"]
    env_file:
      - ${DOCKER_ENV_FILE:-.env}
    entrypoint: ["/bin/sh", "-c"]
    # Prometheus cannot read environment variables in its config, so the token is written to a file it can read.
    command:
      - >
        printf '%s' "$$METRICS_TOKEN" > /tmp/metrics_token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - questlog-net

volumes:
  prometheus_data:
  postgres_data:
  redis_data:
  backend_venv:
  frontend_node_modules:
  frontend_next:

networks:
  questlog-net:
    driver: bridge