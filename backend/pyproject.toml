[project]
name = "backend"
version = "0.1.0"
description = "Backend module for QuestLog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "django>=4.2",
    "django-cors-headers>=4.9.0",
    "django-csp>=4.0",
    "django-environ>=0.14.0",
    "django-redis>=7.0.0",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "django-stubs[compatible-mypy]>=5.1.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "factory-boy>=3.3.1",
    "ruff>=0.16.6",
    "psycopg2-binary>=2.9.12",
    "whitenoise>=6.12.0",
    "django-migration-linter>=6.0.0",
]
[project.optional-dependencies]
prod = [
    "psycopg2>=2.9.12",
    "gunicorn>=23.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "DJ",
    "C4",
    "RUF",
]
ignore = [
    "DJ001",
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["RUF012"]
"**/tests/*.py" = ["S101"]
"**/views.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["config", "catalog", "profiles", "tracking"]

[tool.mypy]
python_version = "3.12"
files = ["."]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/", "\\.venv/"]
check_untyped_defs = true
disallow_untyped_defs = false # TODO: Update later as typing is updated/fixed
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py", "tests.py", "*_tests.py", "test_*.py"]
testpaths = ["catalog", "profiles", "tracking", "core"]
addopts = "--reuse-db --nomigrations"

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "config/settings.py",
    "*/apps.py",
]

[tool.coverage.report]
fail_under = 10
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
